# Lint and test on every push and pull request (PAD-91). The app itself (Xcode, SwiftTerm's build
# plugin that the operator trusts by hand) is built on the Mac, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    env:
      # The Xcode the operator builds with (MacOSX26.5 SDK, Swift 6.3), not the image's default.
      # macos-15 has no Xcode past 26.3, and its default 16.4 (Swift 6.1) cannot resolve swift-crypto 5.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      # TODO: pin these actions by commit SHA (look the SHAs up on each action's releases page).
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test

  linux:
    # PaddockCore without Apple frameworks, the way a Paddock sandbox runs it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Swift
        run: mise run swift-linux
      - name: Test
        run: |
          export PATH="$HOME/.local/share/mise/shims:$PATH"
          mise run test

# Development tools for Paddock. Run `mise install` once, then `mise run <task>` (`mr <task>`).
# Xcode 16+ (and its Swift toolchain) is installed separately from the App Store or developer.apple.com.

[tools]
# Xcode's tools: macOS only, so mise install works in a Linux sandbox (tools/sandbox/paddock).
xcodegen = { version = "2.46.0", os = ["macos"] }
xcbeautify = { version = "3.2.1", os = ["macos"] }
swiftlint = "0.65.1"
swiftformat = "0.64.0"
shellcheck = "0.11.0"
# Backlog.md CLI for tickets and docs (needs Node)
"npm:backlog.md" = "1.54.0"

# Tasks are files in tools/tasks, one script each, with their description, dependencies, and
# arguments in #MISE and #USAGE lines at the top; a task's name is its file name without the
# extension (tools/tasks/hang.sh is `mise run hang`). `mise tasks` lists them.
[task_config]
includes = ["tools/tasks"]

# In a shell where mise is activated (`mise activate`)
[shell_alias]
mr = "mise run"
